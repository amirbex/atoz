<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtoZ responsive logo motion gallery</title><link rel="stylesheet" href="motion.css"><header class="top"><h1>AtoZ motion library</h1><p>48 responsive SVG logo motions · intro, loader, waiting & outro</p></header><section class="controls"><label>Brand<select id="brand"><option value="atoz">AtoZ</option><option value="blog">AtoZ Blog</option><option value="tools">AtoZ Tools</option><option value="book">AtoZ book</option><option value="pb">AtoZ PB</option><option value="solicitor">AtoZ Solicitor</option></select></label><label>Motion<select id="state"><option value="intro">Intro</option><option value="loader">Loading</option><option value="waiting">Waiting</option><option value="outro">Outro</option></select></label><label>Orientation<select id="orientation"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select></label><button id="replay" type="button">Replay</button></section><main><div class="frame" id="frame"><img id="preview" src="atoz/intro-horizontal.svg" alt="AtoZ animated logo"></div><a class="download" id="download" href="atoz/intro-horizontal.svg" download>Download source SVG</a><p class="note">SVG sources respect reduced-motion settings. Use HTML gallery controls to review responsive horizontal and vertical compositions.</p></main><script>const $=id=>document.getElementById(id),frame=$('frame'),image=$('preview');function update(){const src=$('brand').value+'/'+$('state').value+'-'+$('orientation').value+'.svg';image.src=src+'?v='+Date.now();$('download').href=src;frame.classList.toggle('vertical',$('orientation').value==='vertical');image.alt=$('brand').selectedOptions[0].text+' '+$('state').value+' logo motion'}['brand','state','orientation'].forEach(id=>$(id).addEventListener('change',update));$('replay').addEventListener('click',update);update();</script></html>
